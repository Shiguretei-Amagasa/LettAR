<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Happy New Year AR</title>

    <!-- ファビコン・ホーム画面追加時のアイコン -->
    <link rel="icon" type="image/jpeg" href="assets/image/LettAR_icon.jpg">
    <link rel="apple-touch-icon" href="assets/image/LettAR_icon.jpg">
    <meta name="theme-color" content="#000000">

    <!-- スマホ対応 -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- MindAR (画像トラッキング) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- opentype.js -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JavaScript -->
    <!-- ★段階的テストのため一時的にコメントアウト中。
         STEP0(カメラ+targetFoundのみ)確認後、
         音→光→文字→紙吹雪→門松の順で1つずつ戻す -->
    <script src="js/light.js"></script>
    <script src="js/text.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

<!-- ================================================
     デバッグ用スタートボタン
     通常は非表示。URLに ?debug=1 を付けた時だけ表示され、
     Hiroマーカーなしで演出シーケンスをテストできる
================================================= -->

<button

    id="debugStartBtn"

    class="debug"

    style="position:fixed;
           bottom:24px;
           left:50%;
           transform:translateX(-50%);
           z-index:2000;
           padding:14px 28px;
           font-size:16px;
           border:none;
           border-radius:999px;
           background:#FFD700;
           color:#000;
           font-weight:bold;">

    ▶ テスト再生

</button>

<a-scene

    embedded
    mindar-image="imageTargetSrc: assets/targets/target.mind?v=3; autoStart:true; uiScanning:no; uiLoading:no; filterMinCF:0.001; filterBeta:0.01;"
    renderer="alpha:true; logarithmicDepthBuffer:true; colorManagement:true;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <!--=========================
            Lights
    ==========================-->

    <a-light type="ambient" color="#fff" intensity="0.7"></a-light>

    <a-light type="directional" color="#fff" intensity="0.9" position="0.5 1 1"></a-light>

    <a-light type="directional" color="#fff8e0" intensity="0.6" position="-0.8 0.4 -0.6"></a-light>

    <!--=========================
            Assets
    ==========================-->

    <a-assets>

        <!-- 効果音 -->

        <!-- ①光が走る演出 -->
        <audio id="kiranSound" src="assets/audio/kiran.mp3"></audio>

        <!-- ②文字(Happy/New/Year!)登場 -->
        <audio id="kotsuzumiSound" src="assets/audio/kodutumi.mp3"></audio>

        <!-- ③門松登場 -->
        <audio id="kadomatsuSound" src="assets/audio/pop.mp3"></audio>

        <!-- ④Year!表示完了 -->
        <audio id="taikoSound" src="assets/audio/wadaiko.mp3"></audio>

        <!-- 音声ナレーション(Happy New Year!の文字表示と同時に再生) -->
        <audio id="voiceSound" src="assets/audio/happynewyear.m4a"></audio>

        <!-- タップ吹き出し画像 -->
        <img id="tapImg" src="assets/image/tap.png">

        <!-- 門松3Dモデル -->
        <a-asset-item id="kadomatsuModel" src="models/scene.gltf"></a-asset-item>

        <!-- 紙吹雪のタイミングで起き上がる画像 -->
        <img id="pics01Img" src="assets/image/pics01.png">
        <img id="pics02Img" src="assets/image/pics02.png">

    </a-assets>


    <!--=========================
           Image Target
           (年賀状の絵柄を認識対象にする。
            assets/targets/newyear.mind に
            コンパイルした結果を差し替える)
    ==========================-->

    <a-entity

        id="markerRoot"

        mindar-image-target="targetIndex: 0">

        <!--=====================
            光エフェクト
        ======================-->

        <a-plane

            id="light"

            position="-0.4 -0.4 0.02"

            rotation="0 0 0"

            width="0.8"

            height="0.05"

            material="shader:flat;
                      color:#FFD700;
                      transparent:true;
                      opacity:0;">

        </a-plane>


        <!--=====================
           3Dテキストの親
           (text.js が Happy / New / Year!
            の3メッシュをここに追加する)
        ======================-->

        <a-entity

            id="textRoot"

            position="0 0.1 0.05">

        </a-entity>


        <!--=====================
           紙吹雪を生成する親
        ======================-->

        <a-entity

            id="confettiRoot"

            position="0 0 0.03">

        </a-entity>


        <!--=====================
           紙吹雪のタイミングで起き上がる画像
           (門松より奥(小さいZ)に置き、門松が手前に来るようにする)
        ======================-->

        <a-entity id="picsRoot">

            <!--
                アンカー(蝶番)の位置=画像の一番下。
                画像本体はアンカーからheightの半分だけ上にずらして配置することで、
                画像の下端がアンカーの原点と一致するようにしている。
                アニメーションはアンカー側のrotation/scaleに対して行う。
            -->

            <a-entity

                id="pics01Anchor"

                position="-0.35 -0.5 0.01"

                rotation="0 0 0"

                visible="false"

                scale="0 0 0">

                <a-plane

                    id="pics01"

                    width="0.5"

                    height="0.5"

                    position="0 0.25 0"

                    material="src:#pics01Img; transparent:true; shader:flat;">

                </a-plane>

            </a-entity>

            <a-entity

                id="pics02Anchor"

                position="0.35 -0.5 0.01"

                rotation="0 0 0"

                visible="false"

                scale="0 0 0">

                <a-plane

                    id="pics02"

                    width="0.5"

                    height="0.5"

                    position="0 0.25 0"

                    material="src:#pics02Img; transparent:true; shader:flat;">

                </a-plane>

            </a-entity>

        </a-entity>


        <!--=====================
           門松(左右)
        ======================-->

        <a-entity

            id="kadomatsuLeft"

            gltf-model="#kadomatsuModel"

            world-upright="correction: 0 0 0"

            debug-axes="2"

            position="-0.65 -0.05 0.12"

            visible="false">

        </a-entity>

        <a-entity

            id="kadomatsuRight"

            gltf-model="#kadomatsuModel"

            world-upright="correction: 0 0 0"

            position="0.65 -0.05 0.12"

            scale="-1 1 1"

            visible="false">

        </a-entity>


        <!--=====================
           タップ吹き出し
           (targetFound後に表示。
            画面タップで音声を解放しつつ演出開始)
        ======================-->

        <a-entity

            id="tapPrompt"

            position="0 0.75 0.05"

            rotation="40 0 0"

            visible="false"

            scale="0 0 0">

            <a-plane

                width="0.8"

                height="0.8"

                material="src:#tapImg; transparent:true; shader:flat;">

            </a-plane>

        </a-entity>

    </a-entity>



    <!--=========================
            Camera
    ==========================-->

    <a-camera

        position="0 0 0"

        look-controls="enabled: false"></a-camera>

</a-scene>

</body>

</html>
